name: build-viogpu-baseline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['third_party/viogpu/**', '.github/workflows/build-viogpu-baseline.yml']

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Restore WDK NuGet packages (stampinf.exe for viogpu INF processing)
      run: |
        $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
        if (-not $nuget) {
          Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile _nuget.exe
          $nuget = "$PWD\_nuget.exe"
        }
        $src = "https://api.nuget.org/v3/index.json"
        & $nuget install Microsoft.Windows.SDK.CPP -OutputDirectory packages -Version 10.0.28000.2526 -NonInteractive -Source $src
        & $nuget install Microsoft.Windows.SDK.CPP.x64 -OutputDirectory packages -Version 10.0.28000.2526 -NonInteractive -Source $src
        & $nuget install Microsoft.Windows.WDK.x64 -OutputDirectory packages -Version 10.0.28000.2526 -NonInteractive -Source $src
        if ($LASTEXITCODE -ne 0) { throw "nuget restore failed" }
        "restored packages:"; (Get-ChildItem packages).Name

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build viogpu (Release x64, Win10, all projects)
      shell: pwsh
      run: |
        $stampInf = Get-ChildItem packages -Recurse -Filter "stampinf.exe" | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
        if (-not $stampInf) { throw "stampinf.exe not found in packages" }
        $stampInfDir = Split-Path $stampInf.FullName
        $env:PATH = "$stampInfDir;$env:PATH"
        $env:SkipPackageVerification = 'true'
        msbuild third_party\viogpu\viogpu.sln "/p:Configuration=Win10 Release" /p:Platform=x64 /m /v:m /nologo
        if ($LASTEXITCODE -ne 0) { throw "msbuild failed with code $LASTEXITCODE" }
        "build exit code: $LASTEXITCODE"

    - name: Collect outputs
      run: |
        $out = "third_party\viogpu"
        $artifacts = @()
        # Kernel driver
        $sys = Get-ChildItem $out -Recurse -Filter "viogpudo.sys" | Where-Object { $_.FullName -match 'objfre_win10_amd64' } | Select-Object -First 1
        if ($sys) { Copy-Item $sys.FullName "$out\build\viogpudo.sys" }
        $inf = Get-ChildItem $out -Recurse -Filter "viogpudo.inx" | Select-Object -First 1
        if ($inf) { Copy-Item $inf.FullName "$out\build\viogpudo.inx" }
        # User-mode exes
        @('viogpuap','viogpures','vgpusrv') | ForEach-Object {
          $exe = Get-ChildItem $out -Recurse -Filter "$_.exe" | Where-Object { $_.FullName -match 'objfre_win10_amd64' } | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName "$out\build\$_.exe" }
          $pdb = Get-ChildItem $out -Recurse -Filter "$_.pdb" | Where-Object { $_.FullName -match 'objfre_win10_amd64' } | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName "$out\build\$_.pdb" }
        }
        # Kernel pdb
        $ksysPdb = Get-ChildItem $out -Recurse -Filter "viogpudo.pdb" | Where-Object { $_.FullName -match 'objfre_win10_amd64' } | Select-Object -First 1
        if ($ksysPdb) { Copy-Item $ksysPdb.FullName "$out\build\viogpudo.pdb" }
        # Stamped INF (generated by stampinf during build)
        $stampedInf = Get-ChildItem "$out\viogpudo" -Recurse -Filter "viogpudo.inf" | Where-Object { $_.FullName -match 'objfre_win10_amd64' } | Select-Object -First 1
        if ($stampedInf) { Copy-Item $stampedInf.FullName "$out\build\viogpudo.inf" }
        # List all collected artifacts
        Get-ChildItem "$out\build" -File | Select-Object Name, Length | Format-Table -AutoSize | Out-String

    - name: Generate and sign catalog
      shell: pwsh
      run: |
        $inf2cat = Get-ChildItem packages -Recurse -Filter "inf2cat.exe" | Select-Object -First 1
        $signtool = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\18\*\*\Common7\IDE\CommonExtensions\Microsoft\*\Team Tools\*\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $signtool) {
          $signtool = Get-ChildItem "C:\Program Files*\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        }
        $buildDir = "third_party\viogpu\build"
        # Generate self-signed cert for test signing
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=viogpudo-test" -KeyUsage DigitalSignature -FriendlyName "viogpudo test" -CertStoreLocation "Cert:\CurrentUser\My"
        $pfxPath = "$env:TEMP\viogpudo-test.pfx"
        $pwd = ConvertTo-SecureString -String "test" -Force -AsPlainText
        Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd | Out-Null
        # Run inf2cat to generate catalog
        & $inf2cat /driver:"$buildDir" /os:10_X64
        if ($LASTEXITCODE -ne 0) { throw "inf2cat failed"
        }
        # Sign the catalog
        if ($signtool) {
          & $signtool sign /f $pfxPath /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$buildDir\viogpudo.cat"
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed"
          }
        }
        "cat generated and signed"

    - name: Upload driver artifacts
      uses: actions/upload-artifact@v4
      with:
        name: viogpudo-baseline-x64
        path: |
          third_party/viogpu/build/viogpudo.sys
          third_party/viogpu/build/viogpudo.inx
          third_party/viogpu/build/viogpudo.inf
          third_party/viogpu/build/viogpudo.cat
          third_party/viogpu/build/viogpudo.pdb
          third_party/viogpu/build/viogpuap.exe
          third_party/viogpu/build/viogpures.exe
          third_party/viogpu/build/vgpusrv.exe
